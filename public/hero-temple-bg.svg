<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Sky & Divine Cosmic Gradients -->
    <radialGradient id="skyCenter" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ff9100" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#ea580c" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#7f1d1d" stop-opacity="0.88"/>
      <stop offset="85%" stop-color="#300606" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#120202" stop-opacity="1"/>
    </radialGradient>

    <!-- Sun Halo / Aura -->
    <radialGradient id="divineSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffd54f" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ff9100" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Temple Sandstone Shading -->
    <linearGradient id="templeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="shikharGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="15%" stop-color="#ffd700"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="flagGradient" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff3d00"/>
      <stop offset="50%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#skyCenter)"/>

  <!-- Divine Sun Rays -->
  <g opacity="0.25">
    <circle cx="960" cy="380" r="420" fill="url(#divineSun)"/>
    <line x1="960" y1="380" x2="180" y2="40" stroke="#ffd700" stroke-width="4" opacity="0.4"/>
    <line x1="960" y1="380" x2="380" y2="20" stroke="#ffd700" stroke-width="3" opacity="0.3"/>
    <line x1="960" y1="380" x2="720" y2="10" stroke="#ffd700" stroke-width="5" opacity="0.4"/>
    <line x1="960" y1="380" x2="1200" y2="10" stroke="#ffd700" stroke-width="5" opacity="0.4"/>
    <line x1="960" y1="380" x2="1540" y2="20" stroke="#ffd700" stroke-width="3" opacity="0.3"/>
    <line x1="960" y1="380" x2="1740" y2="40" stroke="#ffd700" stroke-width="4" opacity="0.4"/>
    <line x1="960" y1="380" x2="1880" y2="220" stroke="#ffd700" stroke-width="3" opacity="0.3"/>
    <line x1="960" y1="380" x2="40" y2="220" stroke="#ffd700" stroke-width="3" opacity="0.3"/>
  </g>

  <!-- Distant Holy Mountains / Sanctum Hills -->
  <path d="M 0 740 Q 340 580 680 710 T 1360 690 T 1920 730 L 1920 1080 L 0 1080 Z" fill="#250404" opacity="0.75"/>
  <path d="M 0 790 Q 420 660 840 760 T 1680 740 T 1920 780 L 1920 1080 L 0 1080 Z" fill="#180202" opacity="0.9"/>

  <!-- Grand Central Temple Architecture Silhouette (Nagar Style Mandir) -->
  <g transform="translate(960, 560)">
    <!-- Main Soaring Shikhar (Central Tower) -->
    <path d="M 0 -360 C -18 -320 -45 -220 -70 -130 C -85 -70 -95 10 -95 90 L 95 90 C 95 10 85 -70 70 -130 C 45 -220 18 -320 0 -360 Z" fill="url(#shikharGold)" stroke="#ffd700" stroke-width="2"/>

    <!-- Urushringa (Sub-spires attached to main spire) -->
    <path d="M -50 -180 C -65 -120 -80 -50 -90 90 L -30 90 C -30 30 -40 -120 -50 -180 Z" fill="#d97706" opacity="0.85"/>
    <path d="M 50 -180 C 65 -120 80 -50 90 90 L 30 90 C 30 30 40 -120 50 -180 Z" fill="#d97706" opacity="0.85"/>

    <!-- Amalaka (Ribbed Stone Ring atop Shikhar) -->
    <ellipse cx="0" cy="-368" rx="28" ry="10" fill="#ffd700" stroke="#fff8e1" stroke-width="2"/>
    <ellipse cx="0" cy="-375" rx="18" ry="6" fill="#ffe082"/>

    <!-- Kalash & Dhwaja (Gold Pitcher & Flag) -->
    <path d="M -6 -375 L 0 -415 L 6 -375 Z" fill="#fff9c4"/>
    <circle cx="0" cy="-415" r="7" fill="#ffd700" stroke="#fff" stroke-width="1.5"/>

    <!-- Sacred Saffron Dhwaja (Flying Flag) -->
    <path d="M 0 -420 L 70 -445 L 30 -425 L 80 -405 Z" fill="url(#flagGradient)">
      <animate attributeName="d" 
        values="M 0 -420 L 70 -445 L 30 -425 L 80 -405 Z;
                M 0 -420 L 76 -440 L 35 -422 L 86 -400 Z;
                M 0 -420 L 70 -445 L 30 -425 L 80 -405 Z" 
        dur="3s" repeatCount="indefinite" />
    </path>
    <line x1="0" y1="-375" x2="0" y2="-435" stroke="#fff9c4" stroke-width="3"/>

    <!-- Left Mandap Tower (Sabha Mandap) -->
    <path d="M -160 -190 C -180 -130 -210 -40 -220 90 L -90 90 C -90 20 -130 -110 -160 -190 Z" fill="url(#templeGold)" stroke="#ffd700" stroke-width="1.5"/>
    <ellipse cx="-160" cy="-196" rx="20" ry="8" fill="#ffd700"/>
    <path d="M -160 -225 L -120 -240 L -140 -228 L -115 -215 Z" fill="#ff6f00"/>

    <!-- Right Mandap Tower -->
    <path d="M 160 -190 C 180 -130 210 -40 220 90 L 90 90 C 90 20 130 -110 160 -190 Z" fill="url(#templeGold)" stroke="#ffd700" stroke-width="1.5"/>
    <ellipse cx="160" cy="-196" rx="20" ry="8" fill="#ffd700"/>
    <path d="M 160 -225 L 200 -240 L 180 -228 L 205 -215 Z" fill="#ff6f00"/>

    <!-- Outer Flanking Shikharas (Left & Right Wings) -->
    <path d="M -290 -80 C -305 -30 -330 30 -340 90 L -210 90 C -210 30 -260 -30 -290 -80 Z" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="-290" cy="-85" rx="16" ry="6" fill="#ffd700"/>

    <path d="M 290 -80 C 305 -30 330 30 340 90 L 210 90 C 210 30 260 -30 290 -80 Z" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="290" cy="-85" rx="16" ry="6" fill="#ffd700"/>

    <!-- High Plinth (Jagati Base) & Steps -->
    <rect x="-370" y="90" width="740" height="45" rx="4" fill="#3a0707" stroke="#ffd700" stroke-width="2"/>
    <rect x="-400" y="135" width="800" height="40" rx="4" fill="#2d0505" stroke="#d97706" stroke-width="1.5"/>
    <rect x="-430" y="175" width="860" height="45" rx="4" fill="#200404" stroke="#ffd700" stroke-width="1.5"/>

    <!-- Intricate Pillars across Front Facade -->
    <g fill="#ffd54f" stroke="#78350f" stroke-width="1">
      <rect x="-240" y="20" width="12" height="70" rx="2"/>
      <rect x="-180" y="20" width="12" height="70" rx="2"/>
      <rect x="-120" y="20" width="12" height="70" rx="2"/>
      <rect x="-60" y="20" width="12" height="70" rx="2"/>
      <rect x="0" y="20" width="14" height="70" rx="2"/>
      <rect x="60" y="20" width="12" height="70" rx="2"/>
      <rect x="120" y="20" width="12" height="70" rx="2"/>
      <rect x="180" y="20" width="12" height="70" rx="2"/>
      <rect x="240" y="20" width="12" height="70" rx="2"/>
    </g>

    <!-- Glowing Sanctum Portal Arch (Torana) -->
    <path d="M -45 90 L -45 15 C -45 -15 45 -15 45 15 L 45 90 Z" fill="#ffd700" opacity="0.35"/>
    <path d="M -35 90 L -35 25 C -35 0 35 0 35 25 L 35 90 Z" fill="#ffe082" opacity="0.6"/>
  </g>

  <!-- Divine Hanuman Silhouette Holding Sanjeevani Mountain with Gada in Left Skies -->
  <g transform="translate(320, 260) scale(0.95)" opacity="0.65">
    <!-- Radiant Aura around Hanumanji -->
    <circle cx="90" cy="110" r="140" fill="url(#divineSun)" opacity="0.55"/>
    
    <!-- Silhouette Path of Lord Hanuman Flying -->
    <!-- Head & Mukut (Crown) -->
    <path d="M 75 40 L 90 15 L 105 40 L 115 55 C 120 70 120 85 105 95 C 95 100 80 100 70 95 C 60 85 60 65 75 40 Z" fill="#ffd700"/>
    <polygon points="90,10 82,30 98,30" fill="#fff9c4"/>

    <!-- Muscular Torso & Arms -->
    <path d="M 65 80 C 40 95 30 130 55 160 C 70 180 110 180 125 155 C 135 125 120 90 95 80 Z" fill="#e65100"/>
    
    <!-- Left Hand Holding Dronagiri / Sanjeevani Mountain Elevated High -->
    <path d="M 40 100 L -15 60 L -30 75 L 30 120 Z" fill="#b71c1c"/>
    <!-- Sanjeevani Mountain -->
    <polygon points="-45,65 -85,20 -15,5 -5,55" fill="#ffd700" stroke="#ff9100" stroke-width="2"/>
    <circle cx="-35" cy="30" r="6" fill="#fff"/>

    <!-- Right Hand with Mace (Gada) -->
    <path d="M 120 110 L 175 145 L 160 160 L 105 130 Z" fill="#b71c1c"/>
    <!-- Gada (Divine Golden Mace) -->
    <line x1="130" y1="120" x2="225" y2="185" stroke="#ffd700" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="230" cy="190" rx="20" ry="15" fill="#ffd700" stroke="#fff9c4" stroke-width="3"/>

    <!-- Flowing Langot & Holy Tail (Kundalini Dhwaja) -->
    <path d="M 85 160 C 90 220 50 250 80 280 C 100 240 120 220 105 160 Z" fill="#ffd700"/>
    <!-- Ascending Tail -->
    <path d="M 70 170 C 40 220 0 200 -20 130 C -35 80 -10 30 30 25 C 20 35 10 70 15 110 C 20 150 50 160 70 170 Z" fill="#ff6f00"/>
  </g>

  <!-- Foreground Atmospheric Mystical Fog & Gradient Blend to Dark -->
  <rect x="0" y="650" width="1920" height="430" fill="url(#fogGradient)"/>
  <defs>
    <linearGradient id="fogGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140202" stop-opacity="0"/>
      <stop offset="35%" stop-color="#190303" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#120202" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#100202" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>
